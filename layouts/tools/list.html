{{ define "main" }}
  <header class="section-intro">
    <p class="eyebrow">PROJECTS &amp; TOOLS</p>
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </header>
  <section class="tool-grid" aria-label="工具列表">
    <a class="tool-card tool-card--featured" href="{{ "tools/cxmt-hl/" | relURL }}">
      <span class="tool-number">01</span>
      <h2>CXMT × HL 估值分析</h2>
      <p>按 CXMT 股价、市值、汇率与溢价，快速推演 HL 的对应价格。</p>
      <span class="tool-link">打开工具 <b aria-hidden="true">→</b></span>
    </a>
    <a class="tool-card" href="{{ "tools/hello-world/" | relURL }}">
      <span class="tool-number">02</span>
      <h2>Hello World</h2>
      <p>第一个静态页面，保留作 GitHub Pages 发布流程的验证页。</p>
      <span class="tool-link">打开页面 <b aria-hidden="true">→</b></span>
    </a>
  </section>
{{ end }}
