<article class="timeline-entry timeline-entry--post">
  <div class="entry-date"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time></div>
  <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
  {{ $summary := .Params.summary | default (.Summary | plainify | truncate 180) }}
  {{ with $summary }}<p class="post-summary">{{ . }}</p>{{ end }}
  {{ with .GetTerms "tags" }}
    <div class="tag-list" aria-label="标签">
      {{ range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
    </div>
  {{ end }}
  <a class="read-more" href="{{ .RelPermalink }}">阅读全文 <span aria-hidden="true">→</span></a>
</article>
