<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}">{{ end }}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ site.Home.RelPermalink }}" aria-label="返回首页">{{ site.Title }}</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ with site.GetPage "/posts" }}{{ .RelPermalink }}{{ end }}">文章</a>
          <a href="{{ with site.GetPage "/notes" }}{{ .RelPermalink }}{{ end }}">短文</a>
          <a href="{{ "archives/" | relURL }}">归档</a>
          <a href="{{ "tags/" | relURL }}">标签</a>
          <a href="{{ "tools/" | relURL }}">工具</a>
        </nav>
      </header>

      <main>
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="site-footer">
        <span>© {{ now.Year }} {{ site.Title }}</span>
        {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
      </footer>
    </div>
  </body>
</html>
