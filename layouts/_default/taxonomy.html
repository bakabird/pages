{{ define "main" }}
  <header class="section-intro">
    <p class="eyebrow">TAG</p>
    <h1>#{{ .Title }}</h1>
    <p>所有标记为“{{ .Title }}”的内容。</p>
  </header>
  <section class="timeline" aria-label="标签内容">
    {{ range .Pages.ByDate.Reverse }}
      {{ if eq .Section "notes" }}{{ partial "note-card.html" . }}{{ else }}{{ partial "post-card.html" . }}{{ end }}
    {{ end }}
  </section>
{{ end }}
